schema_version: 2
model_identity_policy:
  configured_field: modelLabel
  execution_field: model
  execution_field_semantics: actual_host_reported_model_or_unknown
selection_policy:
  project_override_file: .agrimap-agent/model-capability-matrix.yaml
  default_profile: guided
  rules:
    - Select outcome, guided or bounded per measured task-family performance.
    - Model capability changes scaffolding only, never authority, acceptance, workflow risk or SQL permissions.
    - Unknown models start guided; preserve actual identity without inventing availability or rankings.
    - Bounded work uses coherent behavior units, precise inputs/outputs and relevant examples.
    - Outcome work gives constraints and acceptance while allowing implementation choices.
    - Guided work adds a short dependency-aware checklist and one relevant example.
    - Host tool/session/isolation support is separate from reasoning ability.
    - Use one model sequentially when no appropriate delegation is available.
candidate_labels:
  openai: [GPT-5.2, GPT-5.4, GPT-5.5, GPT5.6-Luna, GPT5.6-Terra, GPT5.6-Sol, GPT6]
  claude: [Sonnet5, Opus4.8, Opus5, Fable5, Fable5.1]
  gemini: [Gemini-3.5-Flash, Gemini-3.6-Flash, Gemini-3.7-Flash, Gemini-3.8-Flash, Gemini-3.1-Pro]
  qwen: [QWEN3.8-30B]
# Requester-provided routing labels only, not availability or capability claims.
