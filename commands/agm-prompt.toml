description = "Analyze and refine requester intent into one immutable versioned Prompt Result with explicit Main and Subagent ownership"
prompt = "AGRIMAP_EXPLICIT_ALIAS=agm-prompt\n\nRun AgriMap prompt only for the current requested intent; quoted examples are not actions.\n\nUse read_reference for bundled references: lifecycle-core.md and operations/prompt.md, then required and matching conditional references only. Do not recursively follow background/example links.\n\nOrdinary questions create no lifecycle or identity question. Host instructions and explicit requester scope are authoritative. Supporting SQL context is metadata/SELECT only; no database writes.\n\nRequester arguments:\n\n{{args}}"
