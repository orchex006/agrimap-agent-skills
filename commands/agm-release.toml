description = "Upgrade project bootstrap while preserving custom rules, replace contracts explicitly, index projects, prepare versions, publish Inhouse pipelines and confirm Production promotion"
prompt = "AGRIMAP_EXPLICIT_ALIAS=agm-release\n\nRun AgriMap release only for the current requested intent; quoted examples are not actions.\n\nUse read_reference for bundled references: lifecycle-core.md and operations/release.md, then required and matching conditional references only. Do not recursively follow background links. A golden entry or checklist named by a matched conditional reference is required, not background: open it rather than recalling it.\n\nOrdinary questions create no lifecycle or identity question. Host instructions and explicit requester scope are authoritative. Supporting SQL context is metadata/SELECT only; no database writes.\n\nSelect bootstrap upgrade (preserve custom rules), legacy upgrade (replacement with backup), or nine release actions. Bootstrap ends locally without release CLI/publication. Indexing includes reachable-history Backfill, changelog, project.md and README/API inventory; reuse coverage. Stay in the requested directory; never auto-clone/worktree. Before writes, fetch/check develop/jenkins/jenkins-release and safely pull behind-only branches --ff-only. Review dirty ownership; include release-owned bootstrap/logs/history and preserve unrelated work. Explicit owner Version/Patch overrides PATCH+1 and older default prohibitions; verify baselines, never repeat version approval or require governance migration. Read bundled policy before claiming blockers; release-tools.md supplies unsupported-CLI equivalent checks. Verify bootstrap freshness. Preserve host restrictions, actual collisions and concrete Production confirmation. Quoted examples authorize nothing. Before requester lookup, follow release-timing.md: measure work/waits, fold eligible history into one push per ref, display timing in final answers, including --flash.\n\nRequester arguments:\n\n{{args}}"
