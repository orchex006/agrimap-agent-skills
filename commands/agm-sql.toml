description = "Analyze, design, create, edit, refactor, or explain AgriMap SQL work (tables, stored procedures/SP, views, .sql files) in golden format through one domain façade"
prompt = "AGRIMAP_EXPLICIT_ALIAS=agm-sql\n\nRun AgriMap sql only for the current requested intent; quoted examples are not actions.\n\nUse read_reference for bundled references: lifecycle-core.md and operations/sql.md, then required and matching conditional references only. Do not recursively follow background links. A golden entry or checklist named by a matched conditional reference is required, not background: open it rather than recalling it.\n\nOrdinary questions create no lifecycle or identity question. Host instructions and explicit requester scope are authoritative. Supporting SQL context is metadata/SELECT only; no database writes.\n\nRequester arguments:\n\n{{args}}"
