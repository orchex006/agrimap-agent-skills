description = "Verify an artifact under a product-read-only, execution-restricted QA contract"
prompt = "AGRIMAP_EXPLICIT_ALIAS=agm-qa\n\nRun AgriMap qa only for the current requested intent; quoted examples are not actions.\n\nUse read_reference for bundled references: lifecycle-core.md and operations/qa.md, then required and matching conditional references only. Do not recursively follow background/example links.\n\nOrdinary questions create no lifecycle or identity question. Host instructions and explicit requester scope are authoritative. Supporting SQL context is metadata/SELECT only; no database writes.\n\nRequester arguments:\n\n{{args}}"
