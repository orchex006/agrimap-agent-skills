name: Package release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version (stable on main, rc.N on release/base-version)
        required: true
        type: string
      promote_latest:
        description: Explicitly make this stable release the default latest
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: package-release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: package-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm run sync
      - name: Require committed generated output
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - run: npm test
      - run: npm run test:release
      - run: npm run audit:tokens:strict
      - name: Prepare verified version artifacts
        id: build
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          node tools/package-release.mjs --release "$VERSION" "$SOURCE_REF" > "$RUNNER_TEMP/package-result.json"
          node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/package-result.json")); fs.appendFileSync(process.env.GITHUB_OUTPUT,"directory="+r.output+"\nsha="+r.sourceSha+"\n");'
      - name: Publish new immutable-version assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PROMOTE_LATEST: ${{ inputs.promote_latest }}
          BUILD_DIR: ${{ steps.build.outputs.directory }}
          SOURCE_SHA: ${{ steps.build.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ "$VERSION" == *-rc.* ]]; then
            if [[ "$PROMOTE_LATEST" == true ]]; then echo 'Prerelease cannot become latest stable'; exit 1; fi
            flags+=(--prerelease)
          fi
          # Atomic create fails if a tag appeared after checkout; never reuse/repoint it.
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v$VERSION" -f "sha=$SOURCE_SHA"
          gh release create "v$VERSION" "$BUILD_DIR"/*.tgz "$BUILD_DIR/release.json" "$BUILD_DIR/SHA256SUMS" --verify-tag --title "v$VERSION" --notes-file "$BUILD_DIR/release-notes.md" --draft "${flags[@]}"
          gh release edit "v$VERSION" --draft=false --latest="$PROMOTE_LATEST"
